#
# Control-M Job Parameters for MQ Intake
#
# This file defines the parameters used across Control-M jobs.
# Update these values to match your environment.
#

# =============================================================================
# APPLICATION PATHS
# =============================================================================

# RMS Application
APP_BASE_RMS=/home/hdwas01/datalakedata/prod/gold/integration/membership/riskstrat/mq-intake-rms
SERVER_PORT_RMS=8081

# Claims Application
APP_BASE_CLAIMS=/home/hdwas01/datalakedata/prod/gold/integration/membership/riskstrat/mq-intake-claims
SERVER_PORT_CLAIMS=8099

# =============================================================================
# HDFS PATHS
# =============================================================================

HDFS_BASE_RMS=/data/raw/membership/hps
HDFS_BASE_CLAIMS=/data/raw/claims/dmih

# =============================================================================
# CONTROL-M SCRIPTS
# =============================================================================

CTM_SCRIPTS=/opt/ctm/scripts/mq-intake
CTM_LOG_DIR=/var/log/ctm

# =============================================================================
# THRESHOLDS
# =============================================================================

# Queue depth thresholds
QUEUE_DEPTH_WARN=10000
QUEUE_DEPTH_CRIT=50000

# Log retention (days)
LOG_RETENTION_DAYS=30

# Temp file max age (hours)
TMP_MAX_AGE_HOURS=2

# =============================================================================
# NOTIFICATION SETTINGS
# =============================================================================

# Email recipients
EMAIL_OPS=datalake-ops@company.com
EMAIL_MGMT=datalake-mgmt@company.com

# ServiceNow
SNOW_INSTANCE=company.service-now.com
# SNOW_API_USER and SNOW_API_PASS should be in secure vault

# PagerDuty
# PAGERDUTY_ROUTING_KEY should be in secure vault

# =============================================================================
# SCHEDULING
# =============================================================================

# Health check interval (minutes)
HEALTH_CHECK_INTERVAL=5

# Queue depth check interval (minutes)
QUEUE_DEPTH_INTERVAL=5

# Backout alert interval (minutes)
BACKOUT_ALERT_INTERVAL=15

# Metrics collection interval (minutes)
METRICS_INTERVAL=60

# Log cleanup time (HH:MM)
LOG_CLEANUP_TIME=02:00

# Temp cleanup time (HH:MM)
TMP_CLEANUP_TIME=03:00
