spring:
  application:
    name: datalake-mq-intake-claims

intake:
  instance-id: ${HOSTNAME:claims-instance-1}
  maxumsgs: 10000
  # Unset: derived from 50% of the JVM's max heap. A fixed value has no
  # relationship to the -Xmx the container actually gets, so it can approve a
  # config that will OOM. Set it explicitly only to go BELOW the derived value.
  # aggregate-memory-ceiling-bytes:

  mq-connections:
    primary:
      host: ${MQ_HOST:localhost}
      port: ${MQ_PORT:1414}
      queue-manager: ${MQ_QUEUE_MANAGER:QM1}
      channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
      transport-type: CLIENT
      credential-ref: ${MQ_CREDENTIAL_REF:}
      receive-timeout-ms: 1000
      reconnect-attempts: 3
      reconnect-delay-ms: 5000

  kerberos:
    enabled: ${KERBEROS_ENABLED:false}
    principal: ${KERBEROS_PRINCIPAL:}
    keytab-path: ${KERBEROS_KEYTAB_PATH:}
    relogin-interval-ms: 3600000  # 1 hour

  hdfs:
    audit-base-path: /data/audit
    temp-file-max-age-ms: 3600000  # 1 hour

  shutdown:
    drain-timeout-ms: 30000  # 30 seconds

  bindings:
    - id: claims
      mq-connection: primary
      source-queue: MQ.DMIH.CLAIMS.IN
      mode: LAND_ONLY
      # No tracker-queue for LAND_ONLY mode
      hdfs-base-path: /data/raw/claims/dmih
      batch-size: 8000          # ≤ MAXUMSGS for LAND_ONLY mode (unit of work is N)
      batch-bytes: 134217728    # 128 MB
      # 0 = no fixed timer. Flushes on batch-size, batch-bytes, or the partition
      # boundary. This matches the legacy writer, which rolls a file only when
      # its partition path changes, and keeps a quiet window to one file instead
      # of one per interval. Trade-off: a message can wait until the end of its
      # quarter-hour window (worst case ~15 min) before landing. Set a positive
      # value here if a freshness SLA requires it.
      batch-interval-ms: 0
      listener-threads: 4
      backout-queue: MQ.DMIH.CLAIMS.BACKOUT
      # BISECT requires backout-threshold >= ceil(log2(batch-size)) + 1 = 14:
      # while a poison bisects toward isolation, adjacent clean messages
      # accumulate backout count too; a lower threshold would misroute them.
      # Set BOTHRESH on the queue manager to match.
      backout-threshold: 14
      # Feeds the backout-depth gauge, which DESIGN §14 nominates as the
      # pager condition. Sampled by browsing (read-only, does not consume).
      # 0 disables the monitor and with it the alert.
      backout-depth-poll-interval-ms: 30000
      degradation-strategy: BISECT  # Claims uses bisection per §6.1
      successes-required-to-restore: 10
