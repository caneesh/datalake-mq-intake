spring:
  application:
    name: datalake-mq-intake-claims

intake:
  # Left empty so the service derives hostname-pid. HOSTNAME alone is unique
  # per host, not per process: two intake JVMs on one host would share a
  # _tmp directory (where startup sweeps the "own" subtree) and could emit
  # identical output filenames. Set explicitly only if you can guarantee
  # uniqueness yourself.
  instance-id: ${INTAKE_INSTANCE_ID:}
  maxumsgs: 10000
  # Unset: derived from 50% of the JVM's max heap. A fixed value has no
  # relationship to the -Xmx the container actually gets, so it can approve a
  # config that will OOM. Set it explicitly only to go BELOW the derived value.
  # aggregate-memory-ceiling-bytes:

  mq-connections:
    primary:
      host: ${MQ_HOST:localhost}
      port: ${MQ_PORT:1414}
      queue-manager: ${MQ_QUEUE_MANAGER:QM1}
      channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
      transport-type: CLIENT
      credential-ref: ${MQ_CREDENTIAL_REF:}
      receive-timeout-ms: 1000
      reconnect-attempts: 3
      reconnect-delay-ms: 5000

  kerberos:
    enabled: ${KERBEROS_ENABLED:false}
    principal: ${KERBEROS_PRINCIPAL:}
    keytab-path: ${KERBEROS_KEYTAB_PATH:}
    relogin-interval-ms: 3600000  # 1 hour

  hdfs:
    # Cluster configuration. REQUIRED to reach a real cluster: a fat jar has
    # only itself on the classpath, so without this Hadoop resolves
    # fs.defaultFS to file:/// and lands data on the server's own disk.
    # Point at the target cluster's conf directory, or list the XML files.
    config-resources: ${HDFS_CONFIG_RESOURCES:}

    # What fs.defaultFS must contain once those files are loaded. On a host
    # that also holds another Hadoop client's configuration, this is the only
    # thing standing between a wrong conf directory and data landing on the
    # wrong cluster -- every other check passes either way.
    expected-nameservice: ${HDFS_EXPECTED_NAMESERVICE:}

    # Hadoop properties applied after the site files, overriding them. Set
    # dfs.client.use.datanode.hostname=true when the client can resolve
    # DataNode hostnames but cannot route to the addresses the NameNode
    # returns -- common when the client sits outside the cluster's network
    # segment. Without it the NameNode connects and the writes still fail.
    properties: {}

    audit-base-path: ${HDFS_AUDIT_BASE_PATH:/data/audit}
    temp-file-max-age-ms: 3600000  # 1 hour

    # How long another instance's staging directory may go without a lease
    # refresh before this one treats it as abandoned and clears its expired
    # files. Instance ids carry the PID, so every restart leaves a directory
    # behind; without reclamation they accumulate for the life of the cluster.
    #
    # Generous on purpose, and only the FIRST of two conditions: a file inside
    # a reclaimed directory must ALSO be older than temp-file-max-age-ms before
    # it is removed. A running instance refreshes its lease continuously, and a
    # file being written right now is not an hour old, so a peer that is merely
    # slow never loses in-flight work.
    instance-lease-timeout-ms: 3600000  # 1 hour

  # Off for claims: reconciliation compares record identities, and claims
  # has no confirmed per-message identity, so it would refuse every run.
  # Turn on once that key is settled.
  reconciliation:
    enabled: false
    interval-ms: 900000        # one partition window
    grace-period-ms: 300000    # let in-flight batches land first
    lookback-windows: 4        # a skipped run must not leave a gap
    quarantine-duplicates: false   # report, never move, without a human

  shutdown:
    drain-timeout-ms: 30000  # 30 seconds

  bindings:
    - id: claims
      mq-connection: primary
      source-queue: ${MQ_SOURCE_QUEUE:MQ.DMIH.CLAIMS.IN}
      mode: LAND_ONLY           # no tracker group for LAND_ONLY mode
      listener-threads: 4
      # ClaimsRecordSerializer is a placeholder: the metadata placement of
      # DESIGN §9.1 is not final and there is no confirmed identity field.
      # Production mode refuses a placeholder by default; this accepts it for
      # this binding only, so the rest of the production gates stay armed --
      # in particular the refusal to write to a local filesystem, which is
      # what stands between this service and landing data on the wrong disk.
      #
      # What is being accepted: the record format is not final, so data landed
      # before it changes has to be reprocessed. That was already recorded as
      # a known limitation of this release. Remove this line once the
      # serializer is final.
      #
      # This is only ONE of the two production gates on claims. The other is
      # claims.identity-field below, which this flag does not and must not
      # bypass: accepting an unfinished format is a reversible cost, while
      # reconciling on the wrong field produces confident, wrong answers.
      accept-placeholder-serializer: ${CLAIMS_ACCEPT_PLACEHOLDER:true}
      batch:
        size: 8000              # ≤ MAXUMSGS for LAND_ONLY mode (unit of work is N)
        bytes: 134217728        # 128 MB
        # 0 = no fixed timer. Flushes on batch size, batch bytes, or the partition
        # boundary. This matches the legacy writer, which rolls a file only when
        # its partition path changes, and keeps a quiet window to one file instead
        # of one per interval. Trade-off: a message can wait until the end of its
        # quarter-hour window (worst case ~15 min) before landing. Set a positive
        # value here if a freshness SLA requires it.
        interval-ms: 0
      hdfs:
        base-path: ${HDFS_BASE_PATH:/data/raw/claims/dmih}
        # Durability: fsync each batch to DataNode disks before close. hflush
        # alone leaves bytes in OS page cache after the MQ commit has already
        # acknowledged the messages; the legacy MDB hsync'd per RECORD. One sync
        # per batch closes the same window at a fraction of that cost.
        hsync-on-flush: true
      backout:
        queue: ${MQ_BACKOUT_QUEUE:MQ.DMIH.CLAIMS.BACKOUT}
        # BISECT requires threshold >= ceil(log2(batch size)) + 1 = 14:
        # while a poison bisects toward isolation, adjacent clean messages
        # accumulate backout count too; a lower threshold would misroute them.
        # Set BOTHRESH on the queue manager to match.
        threshold: 14
        # Suppress backout routing while failures are infrastructure-classified.
        # Delivery count cannot tell a malformed message from a healthy one
        # that sat in batches which rolled back because the landing path was
        # unwritable; without this, such an outage diverts good messages to a
        # queue that must then be replayed by hand. A genuine poison message
        # still reaches the BOQ — its own failure classifies as message data,
        # which opens the gate on the next redelivery.
        #
        # This matters more here than for RMS, not less. Claims carries the
        # higher volume, and BISECT drives the threshold to 14, so an outage
        # would spend far longer accumulating delivery counts across far more
        # messages before anything was diverted — and divert far more when it
        # finally was.
        route-only-on-data-failures: true
        # Feeds the backout-depth gauge, which DESIGN §14 nominates as the
        # pager condition. Sampled by browsing (read-only, does not consume).
        # 0 disables the monitor and with it the alert.
        depth-poll-interval-ms: 30000
      degradation:
        strategy: BISECT        # Claims uses bisection per §6.1
        successes-required-to-restore: 10


# Health semantics for an MQ consumer: this service serves no inbound traffic,
# so the ONLY thing a 503 achieves is a pod restart. DOWN (503) is therefore
# reserved for "every binding unhealthy"; PARTIAL_OUTAGE and DEGRADED return
# 200 and are alerted on via their status string and per-binding metrics —
# restarting the pod over an isolated binding failure would interrupt the
# healthy bindings to fix one that is already contained.
management:
  endpoints:
    web:
      exposure:
        # See the RMS application.yml for the rationale: without this only
        # /actuator/health is reachable and the mq_intake_* metrics are
        # invisible over HTTP.
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      status:
        order: DOWN,OUT_OF_SERVICE,PARTIAL_OUTAGE,DEGRADED,UNKNOWN,UP
        http-mapping:
          PARTIAL_OUTAGE: 200
          DEGRADED: 200
      group:
        # Liveness = "is the JVM alive", nothing else. Binding state must
        # never restart the pod.
        liveness:
          include: ping

# The field that identifies a claims record, used by reconciliation and
# de-duplication. Production startup is blocked until it is set: without it
# there is nothing stable to compare landed records against.
#
# Candidates named in the design are CLM_XMITSN_ID and REC_CTL_NBR. Which one
# is correct is a data-ownership decision (open item #17), not a configuration
# default -- a field that is not genuinely unique and stable makes every
# reconciliation result confidently wrong, which is worse than having none.
claims:
  identity-field: ${CLAIMS_IDENTITY_FIELD:}
