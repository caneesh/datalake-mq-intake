spring:
  application:
    name: datalake-mq-intake-rms

intake:
  instance-id: ${HOSTNAME:rms-instance-1}
  maxumsgs: 10000
  aggregate-memory-ceiling-bytes: 1073741824  # 1 GB

  mq:
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:1414}
    queue-manager: ${MQ_QUEUE_MANAGER:QM1}
    channel: ${MQ_CHANNEL:DEV.APP.SVRCONN}
    user: ${MQ_USER:}
    password: ${MQ_PASSWORD:}
    receive-timeout-ms: 1000

  kerberos:
    enabled: ${KERBEROS_ENABLED:false}
    principal: ${KERBEROS_PRINCIPAL:}
    keytab-path: ${KERBEROS_KEYTAB_PATH:}
    relogin-interval-ms: 3600000  # 1 hour

  hdfs:
    audit-base-path: /data/audit
    temp-file-max-age-ms: 3600000  # 1 hour

  shutdown:
    drain-timeout-ms: 30000  # 30 seconds

  bindings:
    - id: rms
      source-queue: MQ.HPS.MEMBERSHIP.IN
      mode: TRACKED
      tracker-queue: MQ.HPS.MEMBERSHIP.TRACKER
      tracker-body-mode: FULL_COPY
      tracker-fields:
        reporting-system: DMIH/DL
        source-system: IIB
        message-status: RCVD
        destination-status: ""
      hdfs-base-path: /data/raw/membership/hps
      batch-size: 4000          # ≤ MAXUMSGS/2 for TRACKED mode (unit of work is 2N)
      batch-bytes: 134217728    # 128 MB
      batch-interval-ms: 30000  # 30 seconds
      listener-threads: 4
      backout-queue: MQ.HPS.MEMBERSHIP.BACKOUT
      backout-threshold: 5
      degradation-strategy: BATCH_OF_ONE
      successes-required-to-restore: 10
