version: '3.8'

services:
  ibm-mq:
    # Pinned by digest (MQ 10.0.0.0). This image is what the 11 real-MQ tests
    # run against — delivery-count semantics, MQRC error codes and channel
    # behaviour all feed assertions, so an unpinned :latest let a queue-manager
    # upgrade silently shift the ground under them.
    image: icr.io/ibm-messaging/mq@sha256:6fb775474f3f45f6dcb3218ee74804be115b1bb90cc65ee7400fdc1f4ffa9dd8
    container_name: mq-intake-ibmmq
    hostname: mq-intake-ibmmq
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1
      MQ_APP_PASSWORD: passw0rd
      MQ_ADMIN_PASSWORD: passw0rd
    ports:
      - "1414:1414"   # MQ listener
      - "9443:9443"   # MQ Console (HTTPS)
    volumes:
      - mq-data:/mnt/mqm
      - ./docker/mq-config:/etc/mqm/config
    healthcheck:
      test: ["CMD", "dspmq", "-m", "QM1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: Hadoop single-node for HDFS testing
  # Uncomment if you need real HDFS instead of local filesystem
  # namenode:
  #   image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
  #   container_name: mq-intake-namenode
  #   environment:
  #     CLUSTER_NAME: test
  #   ports:
  #     - "9870:9870"
  #     - "9000:9000"
  #   volumes:
  #     - hadoop-namenode:/hadoop/dfs/name

volumes:
  mq-data:
  # hadoop-namenode:
